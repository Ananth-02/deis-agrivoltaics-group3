# Network for the Pi base station (Ubuntu Server 24.04). See docs/pi_base_station.md, step 3.
#
#   eth0   cable to the group router: default route, SSH, the Arduino panel
#   wlan0  the AI deck access point, for the camera stream only (no default route, no DNS)
#
# Install with the steps in the guide (back up the old file, then "sudo netplan try").
network:
  version: 2
  ethernets:
    eth0:
      dhcp4: true
  wifis:
    wlan0:
      dhcp4: true
      dhcp4-overrides:
        use-routes: false
        use-dns: false
      optional: true
      access-points:
        "WiFi streaming example": {}
